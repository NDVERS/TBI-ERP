<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Industrial Zinc Base -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#27272a" stroke-width="2"/>

  <!-- Batching Plant Silos -->
  <!-- Silo 1 (Cement Tower) -->
  <path d="M14 14C14 12.8954 14.8954 12 16 12H24C25.1046 12 26 12.8954 26 14V26L20 33L14 26V14Z" fill="#f4f4f5"/>
  <!-- Silo 2 (Additive / Flyash Tower) -->
  <path d="M28 14C28 12.8954 28.8954 12 30 12H38C39.1046 12 40 12.8954 40 14V26L34 33L28 26V14Z" fill="#a1a1aa"/>

  <!-- Silo Legs / Supports -->
  <line x1="16" y1="26" x2="16" y2="34" stroke="#52525b" stroke-width="1.5"/>
  <line x1="24" y1="26" x2="24" y2="34" stroke="#52525b" stroke-width="1.5"/>
  <line x1="30" y1="26" x2="30" y2="34" stroke="#52525b" stroke-width="1.5"/>
  <line x1="38" y1="26" x2="38" y2="34" stroke="#52525b" stroke-width="1.5"/>

  <!-- Aggregate Conveyor Truss -->
  <line x1="49" y1="13" x2="35" y2="33" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mixing Hopper & Batching Chute -->
  <path d="M18 34H36L33 39H21L18 34Z" fill="#71717a"/>

  <!-- Bold Industrial TBI Brand Acronym -->
  <text x="31" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">TBI</text>

  <!-- Industrial Amber Indicator Dot -->
  <circle cx="48" cy="51" r="2.5" fill="#f59e0b"/>
</svg>
